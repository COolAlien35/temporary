[project]
name = "quantumloop-backend"
version = "0.1.0"
description = "Modular API and workers for QuantumLoop"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "celery[redis]>=5.6,<6",
  "fastapi>=0.115,<1",
  "pgvector>=0.5,<0.6",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "pyjwt[crypto]>=2.10,<3",
  "python-socketio>=5.13,<6",
  "redis>=5.2,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  { include-group = "quantum" },
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pyyaml>=6,<7",
  "ruff>=0.11,<1",
  "websocket-client>=1.9.2",
]
quantum = ["qiskit-aer==0.17.2"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*", "socketio", "socketio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config -ra"
markers = ["integration: requires real PostgreSQL, Redis, and a running Celery worker"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
